<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>하루 하나, 새로운 시도</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="nav">
    <div class="nav__brand">하루 하나, 새로운 시도</div>
    <div class="nav__right">
      <div class="nav__auth">
        <div id="navLoggedOut" class="nav__auth-group">
          <button type="button" id="navLoginBtn" class="nav__auth-btn">로그인</button>
        </div>
        <div id="navLoggedIn" class="nav__auth-group" hidden>
          <button type="button" id="navWriteBtn" class="nav__auth-btn">글쓰기</button>
          <button type="button" id="navLogoutBtn" class="nav__auth-btn">로그아웃</button>
        </div>
      </div>
      <button id="themeToggle" class="theme-toggle" aria-label="다크 모드 전환">🌙</button>
    </div>
  </header>

  <main>
    <div id="viewHome">
      <section class="hero">
        <h1>하루 하나, 새로운 시도</h1>
        <p>매일 새로운 것을 하나씩 시도하고 여기에 기록합니다.</p>
      </section>

      <section class="section">
        <div id="postList" class="post-list">
          <p class="post-list__empty">아직 기록된 시도가 없습니다.</p>
        </div>
      </section>
    </div>

    <div id="viewPost" class="section" hidden>
      <button type="button" id="backToListBtn" class="link-btn">← 목록으로</button>
      <article id="postDetail" class="post-detail"></article>
    </div>

    <div id="viewLogin" class="section" hidden>
      <h2>로그인</h2>
      <form id="authForm" class="contact-form">
        <input type="email" id="authEmail" name="authEmail" placeholder="이메일" required />
        <input type="password" id="authPassword" name="authPassword" placeholder="비밀번호" required minlength="6" />
        <button type="submit" class="btn">로그인</button>
        <button type="button" id="forgotPasswordBtn" class="link-btn">비밀번호를 잊으셨나요?</button>
        <p id="authStatus" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>

    <div id="viewRecovery" class="section" hidden>
      <h2>새 비밀번호 설정</h2>
      <p>새 비밀번호를 입력해 주세요.</p>
      <form id="recoveryForm" class="contact-form">
        <input type="password" id="newPassword" name="newPassword" placeholder="새 비밀번호 (6자 이상)" required minlength="6" />
        <button type="submit" class="btn">비밀번호 변경</button>
        <p id="recoveryStatus" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>

    <div id="viewRecoveryComplete" class="section" hidden>
      <h2>완료</h2>
      <p>비밀번호 변경이 완료되었습니다.</p>
      <button type="button" id="goToLoginBtn" class="btn">다시 로그인하기</button>
    </div>

    <div id="viewWrite" class="section" hidden>
      <h2>새 글 쓰기</h2>
      <form id="postForm" class="contact-form">
        <input type="text" id="postTitle" name="postTitle" placeholder="제목" required />
        <textarea id="postContent" name="postContent" placeholder="오늘 시도한 것을 적어보세요" rows="8" required></textarea>
        <button type="submit" class="btn">게시하기</button>
        <p id="postStatus" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> 하루 하나, 새로운 시도.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
